[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts = -v --tb=short --strict-markers --strict-config
norecursedirs = 
    .*
    assets
    dist_installer
    gui
    node_modules
    .agents
    test_virgin_env
    scripts
    build
    dist
filterwarnings =
    error
    ignore::DeprecationWarning:fastapi.testclient
    ignore::starlette.exceptions.StarletteDeprecationWarning
    ignore::FutureWarning:pynvml
    ignore::FutureWarning:torch.cuda
    ignore::UserWarning:torch
    ignore::ResourceWarning
    ignore::DeprecationWarning:huggingface_hub
    ignore::DeprecationWarning:hf_xet
    ignore::UserWarning:huggingface_hub
